<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoBite - 地緣政治智慧平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column">
        <!-- Header -->
        <header class="py-4">
            <div class="container">
                <nav class="navbar navbar-expand-lg navbar-dark">
                    <a class="navbar-brand fw-bold fs-3" href="#">
                        <span class="geo">Geo</span><span class="bite text-primary">Bite</span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-fill d-flex align-items-center">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8 text-center">
                        <h1 class="display-3 fw-bold mb-4">
                            只有 <span class="text-primary">15%</span> 的人了解地緣政治
                        </h1>
                        <p class="lead fs-4 mb-5">
                            你會加入他們嗎？
                        </p>
                        
                        <div class="mb-5">
                            <p class="fs-5">GeoBite 提供每日地緣政治分析，幫助您掌握全球戰略動態</p>
                        </div>
                        
                        <div class="d-grid gap-3 d-md-flex justify-content-center">
                            <a href="quiz.html" class="btn btn-primary btn-lg px-5 py-3 fs-5">
                                開始測試 <i class="bi bi-arrow-right ms-2"></i>
                            </a>
                            <a href="#daily" class="btn btn-outline-light btn-lg px-5 py-3 fs-5">
                                每日簡報
                            </a>
                        </div>
                    </div>
                </div>
                
                <!-- Daily Briefings Preview -->
                <div class="row mt-5 pt-5" id="daily">
                    <div class="col-12">
                        <h2 class="text-center mb-4">每日期權分析</h2>
                        <div class="row g-4">
                            <div class="col-md-4">
                                <div class="card bg-card text-white h-100">
                                    <div class="card-body">
                                        <h5 class="card-title">週一：中美科技戰</h5>
                                        <p class="card-text">深入了解當前科技競爭對全球經濟格局的影響。</p>
                                        <a href="daily/monday.html" class="btn btn-sm btn-outline-primary">閱讀更多</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-card text-white h-100">
                                    <div class="card-body">
                                        <h5 class="card-title">週二：中東水資源危機</h5>
                                        <p class="card-text">伊朗與海灣國家之間的水資源爭奪及其戰略意義。</p>
                                        <a href="daily/tuesday.html" class="btn btn-sm btn-outline-primary">閱讀更多</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-card text-white h-100">
                                    <div class="card-body">
                                        <h5 class="card-title">週三：AI 與全球權力</h5>
                                        <p class="card-text">人工智能如何重塑國際關係和國家競爭力。</p>
                                        <a href="daily/wednesday.html" class="btn btn-sm btn-outline-primary">閱讀更多</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-4 mt-auto">
            <div class="container text-center">
                <p class="text-muted">&copy; 2026 GeoBite. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
